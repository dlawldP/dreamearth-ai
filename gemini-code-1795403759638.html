    // 3. 한국어 꿈 입력 분석 & 과학적 근거 기반 현실 발생 확률 엔진
    function analyzeDreamScientifically(inputText) {
      const text = inputText.trim();
      const lower = text.toLowerCase();

      const explicit = {
        topography: [],
        hydrosphere: [],
        weather: [],
        atmosphere: []
      };

      // 사용자 직접 묘사 추출
      if (/(들판|평야|평원|초원)/.test(text)) explicit.topography.push('광활한 평야·들판');
      if (/(절벽|돌기둥|육각형|협곡|산|화산)/.test(text)) {
        if (/화산/.test(text)) explicit.topography.push('화산 지형');
        if (/(돌기둥|육각형)/.test(text)) explicit.topography.push('육각형 주상절리');
        if (/(절벽|협곡)/.test(text)) explicit.topography.push('해안 절벽·협곡');
      }
      if (/(사막|모래)/.test(text)) explicit.topography.push('사막·모래 퇴적 지형');

      if (/(호수|염호|물)/.test(text)) {
        explicit.hydrosphere.push(/보라/.test(text) ? '보라색 염호 수환경' : '호수·얕은 수면');
      }
      if (/(쓰나미|파도|해일|바다|해안)/.test(text)) explicit.hydrosphere.push('해양·연안 파랑');
      if (/(폭포|얼음|빙하)/.test(text)) explicit.hydrosphere.push('빙하·결빙 수계');

      if (/안개/.test(text)) explicit.weather.push('짙은 지표 안개');
      if (/(모래바람|모래폭풍|바람|돌풍)/.test(text)) explicit.weather.push('강풍·모래바람');
      if (/(눈보라|폭설|눈)/.test(text)) explicit.weather.push('강한 눈보라(블리자드)');
      if (/화산재/.test(text)) explicit.weather.push('화산재 분출 기류');

      if (/오로라/.test(text)) explicit.atmosphere.push('고에너지 오로라 발광');
      if (/(은하수|노을|밤하늘)/.test(text)) explicit.atmosphere.push('야간 천문·산란 광학');

      if (explicit.topography.length === 0) explicit.topography.push('복합 자연 지형');
      if (explicit.hydrosphere.length === 0) explicit.hydrosphere.push('지표 수권 환경');
      if (explicit.weather.length === 0) explicit.weather.push('국지적 기상 변화');

      // 과학적 개연성 및 현실 발생 확률(%) 정밀 판별
      let probability = 42;
      let category = '복합 자연현상';
      let reassuranceSummary = '';
      const realEvidence = [];
      const unrealEvidence = [];

      if (/(쓰나미|해일|화산)/.test(text)) {
        category = '지질·해양 재해 악몽 검증';
        probability = /300m|산보다/.test(text) ? 2 : 11;
        reassuranceSummary =
          '꿈속에서 본 “산보다 높은 초대형 쓰나미와 동시 화산 폭발”이 오늘 현실에서 일어날 확률은 2% 미만으로 물리적으로 불가능에 가깝습니다. NOAA 해양 데이터에 따르면 실제 지진해일의 외해 파고는 0.3~1.5m 수준이며, 전 세계 화산 관측망이 수일 전부터 지진·가스 전조를 실시간 감시하므로 안심하셔도 됩니다.';
        realEvidence.push({
          title: '화산 분화 및 국지적 연안 해일 현상 자체',
          detail: '판 경계 해저 화산 분화나 산사태로 인해 국지적인 지진해일이 발생하는 지질학적 메커니즘 자체는 지구상에 실존합니다. (NOAA Tsunami Database)'
        });
        unrealEvidence.push({
          title: '산 높이(수백 m) 파고 및 즉각적 전역 재난',
          detail: '해양 수심과 에너지 보존 법칙상 일반 해안에서 산 높이의 물벽이 형성되는 것은 불가능하며, 역사상 최대 메가쓰나미도 좁은 빙하 만(리트야 만) 내부에 국한된 특수 사례입니다.'
        });
      } else if (/오로라/.test(text) && /(지표면|바닥|내려와|닿)/.test(text)) {
        category = '신비 현상 · 대기물리 검증';
        probability = 18;
        reassuranceSummary =
          '보라색 호수와 짙은 안개, 모래바람은 실제 지구 특정 지역에서 관측 가능한 현상이지만, 오로라가 지표면까지 내려오는 현상은 대기 물리학적으로 발생 확률 0%입니다. 꿈속의 강렬한 시각적 대비가 만들어낸 환상적인 장면이므로 불길한 징조로 걱정하지 않으셔도 됩니다.';
        realEvidence.push({
          title: '보라색·붉은빛 호수 & 안개·모래바람 공존',
          detail: '호염성 고세균(Halobacteria)이 번식한 고염도 호수(세네갈 레트바, 탄자니아 나트론)와 해무 유입 후 모래바람이 부는 나미브 사막 사례는 NASA 위성으로 실존이 확인되었습니다.'
        });
        unrealEvidence.push({
          title: '오로라의 지표면 도달 (저고도 접촉)',
          detail: 'NOAA SciJinks 및 NASA에 따르면 오로라는 태양풍 입자가 지상 80~500km 상층 대기(열권)의 산소·질소 원자와 충돌해 빛을 내는 현상으로, 대기 밀도가 높은 지표면 근처에서는 물리적으로 형성될 수 없습니다.'
        });
      } else if (/(눈보라|폭설|얼음|폭포)/.test(text)) {
        category = '극한 기상 악몽 검증';
        probability = 24;
        reassuranceSummary =
          '거대한 폭포가 흐르던 모습 그대로 1초 만에 얼어붙는 현상은 열역학적 잠열 방출 시간 때문에 현실에서 불가능합니다. 영하 30℃ 이하의 극한 한파가 수일간 지속되어야 결빙이 진행되므로, 꿈속 급속 빙결 재난이 현실에서 갑자기 닥칠 가능성은 극히 낮습니다.';
        realEvidence.push({
          title: '육각형 주상절리 협곡과 블리자드(눈보라)',
          detail: '북아일랜드 자이언트 코즈웨이나 아이슬란드 스바르티포스처럼 육각형 현무암 주상절리 협곡에 강한 눈보라가 몰아치는 환경은 실제로 존재합니다.'
        });
        unrealEvidence.push({
          title: '흐르는 대규모 폭포의 순간 빙결',
          detail: '유속이 빠른 대량 수류는 물의 비열(4.184 J/g·K)과 응고열로 인해 순식간에 공중에서 얼어붙을 수 없으며, 수 주에 걸쳐 고드름이 자라나듯 점진적으로 결빙됩니다.'
        });
      } else {
        category = '지구과학 환경 실존성 검증';
        probability = 78;
        reassuranceSummary =
          '입력하신 꿈속 자연환경은 실제 지구의 특수 지형 및 기상 조건과 매우 높은 일치도를 보입니다. 재난적 위험 요소가 없는 자연 풍경이므로, 아래 추천된 실제 지구 후보지를 통해 꿈속 장면을 직접 탐사해 보실 수 있습니다.';
        realEvidence.push({
          title: '지형·수환경·기후의 높은 지구과학적 정합성',
          detail: '광활한 소금 평원의 거울 반사 현상(볼리비아 우유니)이나 고원 화산 지대의 안개·오로라(아이슬란드)처럼 실제 지구에서도 관측 가능한 자연현상입니다.'
        });
        unrealEvidence.push({
          title: '꿈속 기억의 시간 압축 및 색채 강조 효과',
          detail: '수면 중 기억 재구성 과정에서 노을·은하수·안개 등 서로 다른 시간대의 기상 현상이 한 장면에 동시에 겹쳐 보일 수 있습니다.'
        });
      }

      // 유사도 알고리즘 계산: 0.35*지형 + 0.25*수환경 + 0.25*기후 + 0.15*기상
      const rankedRegions = EARTH_DATABASE.map((region) => {
        let keywordHits = 0;
        region.keywords.forEach((kw) => {
          if (text.includes(kw)) keywordHits += 1;
        });
        const boost = Math.min(14, keywordHits * 4);
        const sTopo = Math.min(99, region.scores.topography + (keywordHits > 0 ? 4 : -8));
        const sHydro = Math.min(99, region.scores.hydrosphere + (keywordHits > 1 ? 3 : -6));
        const sClim = Math.min(99, region.scores.climate + (keywordHits > 0 ? 2 : -5));
        const sWeath = Math.min(99, region.scores.weather + (keywordHits > 1 ? 4 : -6));
        const total = Math.min(
          98,
          Math.round(0.35 * sTopo + 0.25 * sHydro + 0.25 * sClim + 0.15 * sWeath + boost * 0.35)
        );

        return {
          ...region,
          matchBreakdown: {
            topography: sTopo,
            hydrosphere: sHydro,
            climate: sClim,
            weather: sWeath
          },
          totalSimilarity: total
        };
      })
        .sort((a, b) => b.totalSimilarity - a.totalSimilarity)
        .slice(0, 3);

      return {
        explicit,
        inferredClimate: rankedRegions[0]?.koppen || 'BSk (반건조 스텝 기후 추정)',
        category,
        probability,
        reassuranceSummary,
        realEvidence,
        unrealEvidence,
        topRegions: rankedRegions
      };
    }

    // 4. 실사 기반 360° 파노라마 & 기상 물리 시뮬레이션 캔버스 컴포넌트
    function ObservatoryViewport({ region, weather, setWeather, dreamText, analysis }) {
      const canvasRef = useRef(null);
      const [viewMode, setViewMode] = useState('panorama'); // 'panorama' | 'compare'
      const [compareSplit, setCompareSplit] = useState(50);
      const [yaw, setYaw] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const dragStartX = useRef(0);
      const imgRef = useRef(null);
      const [imgLoaded, setImgLoaded] = useState(false);

      useEffect(() => {
        setImgLoaded(false);
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          imgRef.current = img;
          setImgLoaded(true);
        };
        img.onerror = () => {
          imgRef.current = null;
          setImgLoaded(false);
        };
        img.src = region.photoUrl;
      }, [region.photoUrl]);

      // 파티클 초기화
      const particles = useMemo(() => {
        return Array.from({ length: 140 }, (_, i) => ({
          x: Math.random(),
          y: Math.random(),
          z: 0.2 + Math.random() * 0.8,
          speed: 0.4 + Math.random() * 1.2,
          size: 1 + Math.random() * 3.5,
          phase: Math.random() * Math.PI * 2
        }));
      }, []);

      useEffect(() => {
        let animId;
        let t = 0;

        const render = () => {
          t += 0.016;
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          if (canvas.width !== Math.floor(rect.width * dpr) || canvas.height !== Math.floor(rect.height * dpr)) {
            canvas.width = Math.floor(rect.width * dpr);
            canvas.height = Math.floor(rect.height * dpr);
          }
          ctx.save();
          ctx.scale(dpr, dpr);
          const w = rect.width;
          const h = rect.height;

          // 강풍 시 미세 카메라 흔들림
          const shakeX = weather.sand > 0.3 ? Math.sin(t * 28) * weather.sand * 2.5 : 0;
          const shakeY = weather.sand > 0.3 ? Math.cos(t * 23) * weather.sand * 1.8 : 0;

          // 배경 실사 사진 파노라마 타일링 렌더링
          ctx.fillStyle = '#07101e';
          ctx.fillRect(0, 0, w, h);

          if (imgRef.current && imgLoaded) {
            const img = imgRef.current;
            const scale = Math.max(h / img.height, (w * 1.35) / img.width);
            const drawW = img.width * scale;
            const drawH = img.height * scale;
            const offsetX = (((yaw % drawW) + drawW) % drawW) - drawW;

            for (let x = offsetX + shakeX; x < w + drawW; x += drawW) {
              ctx.drawImage(img, x, (h - drawH) * 0.5 + shakeY, drawW, drawH);
            }
          } else {
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(0.55, '#1e293b');
            grad.addColorStop(1, '#090d16');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
          }

          // 1:1 비교 모드일 경우 오른쪽 절반은 원본 사진 보존, 왼쪽은 꿈속 기상/색채 합성
          const dreamWidth = viewMode === 'compare' ? (w * compareSplit) / 100 : w;

          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, dreamWidth, h);
          ctx.clip();

          // 꿈속 색채 보정 (보라색 호수/신비로운 대기 톤)
          if (dreamText.includes('보라')) {
            const purpleTint = ctx.createLinearGradient(0, h * 0.48, 0, h);
            purpleTint.addColorStop(0, 'rgba(139, 92, 246, 0.05)');
            purpleTint.addColorStop(0.4, 'rgba(147, 51, 234, 0.34)');
            purpleTint.addColorStop(1, 'rgba(88, 28, 135, 0.48)');
            ctx.fillStyle = purpleTint;
            ctx.fillRect(0, h * 0.48, w, h * 0.52);
          }

          // 557.7nm 산소·질소 자기장 커튼형 오로라 렌더링
          if (weather.aurora > 0.02) {
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            const curtains = 4;
            for (let c = 0; c < curtains; c++) {
              const baseY = h * (0.14 + c * 0.055);
              for (let x = 0; x <= w; x += 14) {
                const wave =
                  Math.sin(x * 0.008 + t * 1.4 + c * 1.7) * 26 +
                  Math.cos(x * 0.019 - t * 0.9 + c) * 14;
                const rayH = (70 + Math.sin(x * 0.03 + t * 2.1) * 35) * weather.aurora;
                const aurGrad = ctx.createLinearGradient(x, baseY + wave - rayH, x, baseY + wave + 24);
                aurGrad.addColorStop(0, 'rgba(168, 85, 247, 0)');
                aurGrad.addColorStop(0.45, `rgba(139, 92, 246, ${0.22 * weather.aurora})`);
                aurGrad.addColorStop(0.85, `rgba(16, 185, 129, ${0.58 * weather.aurora})`);
                aurGrad.addColorStop(1, 'rgba(16, 185, 129, 0)');
                ctx.fillStyle = aurGrad;
                ctx.fillRect(x, baseY + wave - rayH, 12, rayH + 24);
              }
            }
            // 수면 오로라 반사
            const reflGrad = ctx.createLinearGradient(0, h * 0.62, 0, h);
            reflGrad.addColorStop(0, 'rgba(16, 185, 129, 0)');
            reflGrad.addColorStop(0.5, `rgba(16, 185, 129, ${0.18 * weather.aurora})`);
            reflGrad.addColorStop(1, `rgba(52, 211, 153, ${0.26 * weather.aurora})`);
            ctx.fillStyle = reflGrad;
            ctx.fillRect(0, h * 0.62, w, h * 0.38);
            ctx.restore();
          }

          // 다층 복사안개 (Mie 산란)
          if (weather.fog > 0.02) {
            const fogGrad = ctx.createLinearGradient(0, h * 0.25, 0, h);
            fogGrad.addColorStop(0, `rgba(226, 232, 240, ${0.06 * weather.fog})`);
            fogGrad.addColorStop(0.55, `rgba(203, 213, 225, ${0.42 * weather.fog})`);
            fogGrad.addColorStop(1, `rgba(241, 245, 249, ${0.68 * weather.fog})`);
            ctx.fillStyle = fogGrad;
            ctx.fillRect(0, 0, w, h);

            for (let i = 0; i < 6; i++) {
              const bankX = ((t * (14 + i * 4) + i * 240) % (w + 400)) - 200;
              const bankY = h * (0.52 + (i % 3) * 0.12);
              const rad = ctx.createRadialGradient(bankX, bankY, 10, bankX, bankY, 210);
              rad.addColorStop(0, `rgba(248, 250, 252, ${0.24 * weather.fog})`);
              rad.addColorStop(1, 'rgba(248, 250, 252, 0)');
              ctx.fillStyle = rad;
              ctx.fillRect(bankX - 210, bankY - 120, 420, 240);
            }
          }

          // Beer-Lambert 모래폭풍 & 고속 모션 블러 모래 궤적
          if (weather.sand > 0.02) {
            const sandVeil = ctx.createLinearGradient(0, h * 0.15, 0, h);
            sandVeil.addColorStop(0, `rgba(180, 120, 56, ${0.12 * weather.sand})`);
            sandVeil.addColorStop(0.6, `rgba(194, 134, 68, ${0.38 * weather.sand})`);
            sandVeil.addColorStop(1, `rgba(146, 92, 38, ${0.56 * weather.sand})`);
            ctx.fillStyle = sandVeil;
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = `rgba(253, 224, 171, ${0.52 * weather.sand})`;
            particles.forEach((p) => {
              const px = ((p.x * w + t * 520 * p.speed * (0.5 + weather.sand)) % (w + 80)) - 40;
              const py = p.y * h + Math.sin(t * 5 + p.phase) * 8;
              const streakLen = (18 + p.z * 38) * weather.sand;
              ctx.lineWidth = p.size * 0.75;
              ctx.beginPath();
              ctx.moveTo(px, py);
              ctx.lineTo(px + streakLen, py - streakLen * 0.08);
              ctx.stroke();
            });
          }

          // 심도 보케 눈보라(블리자드) 렌더링
          if (weather.snow > 0.02) {
            particles.forEach((p) => {
              const sx = ((p.x * w + Math.sin(t * 1.8 + p.phase) * 45 + t * 90 * weather.snow) % w);
              const sy = ((p.y * h + t * 190 * p.speed * (0.4 + weather.snow)) % h);
              ctx.beginPath();
              ctx.fillStyle = `rgba(255, 255, 255, ${0.35 + p.z * 0.55 * weather.snow})`;
              ctx.arc(sx, sy, p.size * (0.8 + p.z * 0.9), 0, Math.PI * 2);
              ctx.fill();
            });
          }

          ctx.restore();

          // 1:1 비교 슬라이더 경계선 표시
          if (viewMode === 'compare') {
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(dreamWidth, 0);
            ctx.lineTo(dreamWidth, h);
            ctx.stroke();

            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(14, 14, 134, 28);
            ctx.fillStyle = '#c084fc';
            ctx.font = 'bold 12px "Noto Sans KR"';
            ctx.fillText('꿈속 환경 재현', 24, 32);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(w - 178, 14, 164, 28);
            ctx.fillStyle = '#34d399';
            ctx.font = 'bold 12px "Noto Sans KR"';
            ctx.fillText(`실제 지구: ${region.name.split(' ')[0]}`, w - 168, 32);
          }

          ctx.restore();
          animId = requestAnimationFrame(render);
        };

        animId = requestAnimationFrame(render);
        return () => cancelAnimationFrame(animId);
      }, [imgLoaded, yaw, weather, viewMode, compareSplit, dreamText, particles, region.name]);

      const handleDownloadSnapshot = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        try {
          const link = document.createElement('a');
          link.download = `DreamEarth_${region.id}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } catch (e) {
          alert('외부 고해상도 실사 이미지의 보안 정책으로 직접 캡처가 제한된 경우 브라우저 스크린샷(Win+Shift+S / Cmd+Shift+4)을 이용해 주세요.');
        }
      };

      const handleExportMarkdown = () => {
        const md = `# DreamEarth AI 지구과학 탐색 리포트\n\n## 1. 입력된 꿈 묘사\n> ${dreamText}\n\n## 2. 과학적 현실 발생 가능성 검증 (${analysis.category})\n- **현실 발생 확률:** ${analysis.probability}%\n- **안심 해설:** ${analysis.reassuranceSummary}\n\n## 3. 실제 지구 유사 지역 TOP 3\n${analysis.topRegions
          .map(
            (r, idx) =>
              `${idx + 1}. **${r.name}** (${r.country}) — 일치율 **${r.totalSimilarity}%**\n   - 좌표/표고: ${r.coords} / ${r.elevation}\n   - 쾨펜 기후: ${r.koppen}\n   - 근거: ${r.nasaNote}`
          )
          .join('\n')}\n`;
        const blob = new Blob([md], { type: 'text/markdown;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'DreamEarth_탐구보고서.md';
        a.click();
        URL.revokeObjectURL(url);
      };

      // 물리 수치 변환
      const visibilityMeters = Math.max(40, Math.round(10000 * Math.pow(1 - weather.fog * 0.92, 2.2)));
      const windSpeedMs = (2.4 + weather.sand * 26.5).toFixed(1);
      const kpIndex = (weather.aurora * 9).toFixed(1);
      const snowRateCm = (weather.snow * 14.5).toFixed(1);

      return (
        <div className="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
          {/* 상단 뷰어 툴바 */}
          <div className="flex flex-wrap items-center justify-between gap-3 px-5 py-3.5 bg-slate-950/90 border-b border-slate-800">
            <div className="flex items-center gap-2.5">
              <span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="text-sm font-bold text-slate-100">
                360° 실사 파노라마 & 기상 물리 관측 뷰어
              </span>
              <span className="hidden sm:inline-block text-xs px-2.5 py-0.5 rounded-full bg-sky-500/15 text-sky-300 border border-sky-500/30">
                기준 지형: {region.name}
              </span>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => setViewMode('panorama')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  viewMode === 'panorama'
                    ? 'bg-sky-500 text-slate-950'
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`}
              >
                360° 가상세계 탐험
              </button>
              <button
                onClick={() => setViewMode('compare')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  viewMode === 'compare'
                    ? 'bg-emerald-400 text-slate-950'
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`}
              >
                실제 지구 사진 1:1 비교
              </button>
              <button
                onClick={handleDownloadSnapshot}
                className="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"
              >
                엽서 저장
              </button>
              <button
                onClick={handleExportMarkdown}
                className="px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/40"
              >
                탐구 리포트(.md)
              </button>
            </div>
          </div>

          {/* 캔버스 스테이지 */}
          <div
            className="relative w-full h-[360px] sm:h-[430px] cursor-grab active:cursor-grabbing select-none"
            onMouseDown={(e) => {
              setIsDragging(true);
              dragStartX.current = e.clientX - yaw;
            }}
            onMouseMove={(e) => {
              if (!isDragging) return;
              setYaw(e.clientX - dragStartX.current);
            }}
            onMouseUp={() => setIsDragging(false)}
            onMouseLeave={() => setIsDragging(false)}
            onTouchStart={(e) => {
              setIsDragging(true);
              dragStartX.current = e.touches[0].clientX - yaw;
            }}
            onTouchMove={(e) => {
              if (!isDragging) return;
              setYaw(e.touches[0].clientX - dragStartX.current);
            }}
            onTouchEnd={() => setIsDragging(false)}
          >
            <canvas ref={canvasRef} className="w-full h-full block" />

            {/* 안내 배지 */}
            <div className="absolute bottom-3 left-3 px-3 py-1.5 rounded-lg bg-slate-950/80 backdrop-blur border border-slate-700/80 text-xs text-slate-300">
              마우스로 좌우 드래그하여 360° 시점 회전 · 좌표 {region.coords} ({region.koppen})
            </div>

            {/* 1:1 비교 슬라이더 조절 바 */}
            {viewMode === 'compare' && (
              <div className="absolute bottom-3 right-3 flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-950/85 backdrop-blur border border-sky-500/40">
                <span className="text-xs text-sky-300 font-semibold">비교 경계</span>
                <input
                  type="range"
                  min="10"
                  max="90"
                  value={compareSplit}
                  onChange={(e) => setCompareSplit(Number(e.target.value))}
                  className="w-28"
                />
              </div>
            )}
          </div>

          {/* 기상·대기 물리 관측 계기판 */}
          <div className="p-5 bg-slate-950/70 border-t border-slate-800">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div className="text-xs font-bold uppercase tracking-wider text-sky-400">
                Meteorological Field Simulator · 실시간 대기 물리 변수 조절
              </div>
              <div className="flex flex-wrap gap-1.5">
                <button
                  onClick={() => setWeather({ fog: 0.72, sand: 0.08, aurora: 0.1, snow: 0 })}
                  className="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300"
                >
                  새벽 복사안개
                </button>
                <button
                  onClick={() => setWeather({ fog: 0.15, sand: 0.85, aurora: 0, snow: 0 })}
                  className="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-amber-300"
                >
                  사하라 모래폭풍
                </button>
                <button
                  onClick={() => setWeather({ fog: 0.2, sand: 0, aurora: 0.95, snow: 0.15 })}
                  className="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-emerald-300"
                >
                  Kp-8 지자기 오로라
                </button>
                <button
                  onClick={() => setWeather({ fog: 0.35, sand: 0, aurora: 0.2, snow: 0.92 })}
                  className="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-sky-200"
                >
                  극지 블리자드
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
              <div className="p-3.5 rounded-xl bg-slate-900 border border-slate-800">
                <div className="flex justify-between items-center mb-1.5">
                  <span className="text-xs font-semibold text-slate-300">복사안개 (Mie 산란)</span>
                  <span className="font-mono-tech text-xs text-sky-300">가시거리 {visibilityMeters}m</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value={weather.fog}
                  onChange={(e) => setWeather({ ...weather, fog: parseFloat(e.target.value) })}
                  className="w-full"
                />
              </div>

              <div className="p-3.5 rounded-xl bg-slate-900 border border-slate-800">
                <div className="flex justify-between items-center mb-1.5">
                  <span className="text-xs font-semibold text-slate-300">모래폭풍 (광학 소광)</span>
                  <span className="font-mono-tech text-xs text-amber-300">풍속 {windSpeedMs}m/s</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value={weather.sand}
                  onChange={(e) => setWeather({ ...weather, sand: parseFloat(e.target.value) })}
                  className="w-full"
                />
              </div>

              <div className="p-3.5 rounded-xl bg-slate-900 border border-slate-800">
                <div className="flex justify-between items-center mb-1.5">
                  <span className="text-xs font-semibold text-slate-300">오로라 (557.7nm 발광)</span>
                  <span className="font-mono-tech text-xs text-emerald-300">지자기 Kp {kpIndex}</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value={weather.aurora}
                  onChange={(e) => setWeather({ ...weather, aurora: parseFloat(e.target.value) })}
                  className="w-full"
                />
              </div>

              <div className="p-3.5 rounded-xl bg-slate-900 border border-slate-800">
                <div className="flex justify-between items-center mb-1.5">
                  <span className="text-xs font-semibold text-slate-300">강설 강도 (블리자드)</span>
                  <span className="font-mono-tech text-xs text-indigo-300">{snowRateCm} cm/h</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value={weather.snow}
                  onChange={(e) => setWeather({ ...weather, snow: parseFloat(e.target.value) })}
                  className="w-full"
                />
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 5. 메인 애플리케이션
    function App() {
      const [dreamInput, setDreamInput] = useState(DREAM_PRESETS[0].text);
      const [weather, setWeather] = useState(DREAM_PRESETS[0].weather);
      const [analysis, setAnalysis] = useState(() => analyzeDreamScientifically(DREAM_PRESETS[0].text));
      const [selectedRegionId, setSelectedRegionId] = useState(() => analyzeDreamScientifically(DREAM_PRESETS[0].text).topRegions[0].id);

      const handleAnalyze = (customText, presetWeather) => {
        const targetText = typeof customText === 'string' ? customText : dreamInput;
        if (!targetText.trim()) return;
        const result = analyzeDreamScientifically(targetText);
        setAnalysis(result);
        setSelectedRegionId(result.topRegions[0].id);
        if (presetWeather) {
          setWeather(presetWeather);
        } else {
          setWeather({
            fog: targetText.includes('안개') ? 0.6 : 0.15,
            sand: /모래|사막|바람/.test(targetText) ? 0.55 : 0.05,
            aurora: targetText.includes('오로라') ? 0.85 : 0.0,
            snow: /눈|폭설|얼음/.test(targetText) ? 0.8 : 0.0
          });
        }
      };

      const activeRegion =
        analysis.topRegions.find((r) => r.id === selectedRegionId) || analysis.topRegions[0];

      return (
        <div className="min-h-screen bg-[#060b14] text-slate-100 pb-16">
          {/* 상단 헤더 */}
          <header className="border-b border-slate-800/90 bg-slate-950/80 backdrop-blur sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2.5">
                  <span className="px-2.5 py-0.5 rounded-md bg-sky-500/20 border border-sky-400/40 text-sky-300 font-mono-tech text-xs font-bold">
                    DREAMEARTH AI
                  </span>
                  <h1 className="text-lg sm:text-xl font-extrabold tracking-tight text-white">
                    꿈속 자연환경 분석 & 실제 지구 유사 지역 관측소
                  </h1>
                </div>
                <p className="text-xs text-slate-400 mt-1">
                  NASA Earth Observatory · GloH2O Köppen-Geiger · NOAA SciJinks 지구과학 데이터 기반 검증 시스템
                </p>
              </div>
              <div className="text-xs text-slate-400 font-mono-tech bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                DB: 18 Earth Twins · Plausibility Engine v2.6
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-6 space-y-6">
            {/* 1. 한국어 꿈 입력 및 시나리오 프리셋 */}
            <section className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                <label className="text-sm font-bold text-slate-100">
                  1. 꿈속에서 본 자연환경이나 재해 장면을 기억나는 대로 입력하세요
                </label>
                <div className="flex flex-wrap gap-1.5">
                  {DREAM_PRESETS.map((preset) => (
                    <button
                      key={preset.id}
                      onClick={() => {
                        setDreamInput(preset.text);
                        handleAnalyze(preset.text, preset.weather);
                      }}
                      className="text-xs px-2.5 py-1 rounded-full bg-slate-800 hover:bg-sky-500/20 hover:text-sky-300 border border-slate-700 transition"
                    >
                      [{preset.badge}] {preset.title.slice(0, 14)}…
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex flex-col sm:flex-row gap-3">
                <textarea
                  rows="2"
                  value={dreamInput}
                  onChange={(e) => setDreamInput(e.target.value)}
                  placeholder="예: 짙은 안개가 낀 보라색 호수 위로 오로라가 지표면까지 내려왔고 거센 모래바람이 불었다."
                  className="flex-1 bg-slate-950 border border-slate-700 focus:border-sky-400 focus:outline-none rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 resize-none"
                />
                <button
                  onClick={() => handleAnalyze()}
                  className="px-6 py-3 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-sky-500/20 transition shrink-0"
                >
                  지구과학 분석 & 재현 실행
                </button>
              </div>
            </section>

            {/* 2. 실사 기반 360° 파노라마 & 기상 시뮬레이션 뷰어 */}
            <ObservatoryViewport
              region={activeRegion}
              weather={weather}
              setWeather={setWeather}
              dreamText={dreamInput}
              analysis={analysis}
            />

            {/* 3. 실제 지구 유사 지역 TOP 3 상시 비교 카드 */}
            <section className="space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <h2 className="text-base font-extrabold text-white">
                  2. 실제 지구 유사 지역 추천 TOP 3 (NASA · GloH2O 기후·지형 정량 매칭)
                </h2>
                <span className="text-xs text-slate-400">
                  카드를 클릭하면 상단 뷰어와 1:1 비교 사진이 해당 지역으로 전환됩니다
                </span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {analysis.topRegions.map((reg, index) => {
                  const isSelected = reg.id === activeRegion.id;
                  return (
                    <div
                      key={reg.id}
                      onClick={() => setSelectedRegionId(reg.id)}
                      className={`cursor-pointer rounded-2xl overflow-hidden border transition-all ${
                        isSelected
                          ? 'bg-slate-900 border-sky-400 ring-2 ring-sky-400/30 shadow-xl'
                          : 'bg-slate-900/70 border-slate-800 hover:border-slate-600'
                      }`}
                    >
                      <div className="relative h-40 overflow-hidden">
                        <img
                          src={reg.photoUrl}
                          alt={reg.name}
                          className="w-full h-full object-cover"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent" />
                        <div className="absolute top-3 left-3 px-2.5 py-1 rounded-md bg-slate-950/85 text-xs font-bold text-sky-300 border border-sky-500/30">
                          추천 #{index + 1} · 일치율 {reg.totalSimilarity}%
                        </div>
                        <div className="absolute bottom-2.5 left-3 right-3">
                          <div className="font-bold text-sm text-white">{reg.name}</div>
                          <div className="text-xs text-slate-300">
                            {reg.country} · {reg.coords}
                          </div>
                        </div>
                      </div>

                      <div className="p-4 space-y-3">
                        <div className="text-xs font-mono-tech text-emerald-300 bg-emerald-500/10 border border-emerald-500/25 px-2.5 py-1 rounded-md">
                          {reg.koppen} · 표고 {reg.elevation}
                        </div>

                        {/* 항목별 유사도 막대 그래프 */}
                        <div className="space-y-1.5 text-xs">
                          {[
                            { label: '지형 (35%)', val: reg.matchBreakdown.topography, color: 'bg-sky-400' },
                            { label: '수환경 (25%)', val: reg.matchBreakdown.hydrosphere, color: 'bg-indigo-400' },
                            { label: '기후 (25%)', val: reg.matchBreakdown.climate, color: 'bg-emerald-400' },
                            { label: '기상 (15%)', val: reg.matchBreakdown.weather, color: 'bg-amber-400' }
                          ].map((bar) => (
                            <div key={bar.label} className="flex items-center gap-2">
                              <span className="w-20 text-slate-400">{bar.label}</span>
                              <div className="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div className={`h-full ${bar.color}`} style={{ width: `${bar.val}%` }} />
                              </div>
                              <span className="w-8 text-right font-mono-tech text-slate-300">{bar.val}%</span>
                            </div>
                          ))}
                        </div>

                        <p className="text-xs text-slate-300 leading-relaxed border-t border-slate-800 pt-2.5">
                          {reg.nasaNote}
                        </p>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* 4. 과학적 현실 발생 가능성(%) 검증 및 구조화 속성 분석 */}
            <section className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              {/* 현실 발생 확률 & 안심 리포트 */}
              <div className="lg:col-span-7 bg-slate-900/85 border border-slate-800 rounded-2xl p-5 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">
                      NOAA SciJinks & NASA 물리 법칙 기반 검증
                    </span>
                    <h3 className="text-base font-extrabold text-white mt-0.5">
                      3. 과학적 현실 발생 확률(%) 및 악몽 안심 리포트
                    </h3>
                  </div>
                  <div className="px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-right">
                    <div className="text-[11px] text-slate-400">현실 발생 가능성</div>
                    <div
                      className={`font-mono-tech text-xl font-extrabold ${
                        analysis.probability < 30 ? 'text-emerald-400' : 'text-sky-400'
                      }`}
                    >
                      {analysis.probability}%
                    </div>
                  </div>
                </div>

                {/* 확률 게이지 바 */}
                <div className="w-full h-3 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                  <div
                    className={`h-full transition-all duration-500 ${
                      analysis.probability < 30
                        ? 'bg-gradient-to-r from-emerald-500 to-teal-400'
                        : 'bg-gradient-to-r from-sky-500 to-indigo-400'
                    }`}
                    style={{ width: `${Math.max(4, analysis.probability)}%` }}
                  />
                </div>

                <div className="p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-xs sm:text-sm text-emerald-100 leading-relaxed">
                  {analysis.reassuranceSummary}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {analysis.realEvidence.map((item, i) => (
                    <div key={i} className="p-3.5 rounded-xl bg-slate-950/90 border border-sky-500/30">
                      <div className="text-xs font-bold text-sky-300 mb-1">
                        ✓ 지구과학적 실존 요소: {item.title}
                      </div>
                      <p className="text-xs text-slate-300 leading-relaxed">{item.detail}</p>
                    </div>
                  ))}
                  {analysis.unrealEvidence.map((item, i) => (
                    <div key={i} className="p-3.5 rounded-xl bg-slate-950/90 border border-amber-500/30">
                      <div className="text-xs font-bold text-amber-300 mb-1">
                        ! 비현실적 과장 요소: {item.title}
                      </div>
                      <p className="text-xs text-slate-300 leading-relaxed">{item.detail}</p>
                    </div>
                  ))}
                </div>
              </div>

              {/* 구조화 속성 분리 (직접 묘사 vs AI 추정) */}
              <div className="lg:col-span-5 bg-slate-900/85 border border-slate-800 rounded-2xl p-5 space-y-4">
                <div>
                  <span className="text-xs font-bold text-purple-400 uppercase tracking-wider">
                    NIST AI RMF Hallucination Control
                  </span>
                  <h3 className="text-base font-extrabold text-white mt-0.5">
                    4. 사용자 직접 묘사 vs AI 추정 기후 분리
                  </h3>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <div className="font-bold text-slate-300 mb-2">사용자 직접 묘사 속성 (Explicit Features)</div>
                    <div className="flex flex-wrap gap-1.5">
                      {analysis.explicit.topography.map((t) => (
                        <span key={t} className="px-2.5 py-1 rounded-md bg-sky-500/15 text-sky-300 border border-sky-500/30">
                          지형: {t}
                        </span>
                      ))}
                      {analysis.explicit.hydrosphere.map((h) => (
                        <span key={h} className="px-2.5 py-1 rounded-md bg-indigo-500/15 text-indigo-300 border border-indigo-500/30">
                          수환경: {h}
                        </span>
                      ))}
                      {analysis.explicit.weather.map((w) => (
                        <span key={w} className="px-2.5 py-1 rounded-md bg-amber-500/15 text-amber-300 border border-amber-500/30">
                          기상: {w}
                        </span>
                      ))}
                      {analysis.explicit.atmosphere.map((a) => (
                        <span key={a} className="px-2.5 py-1 rounded-md bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                          대기: {a}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="p-3 rounded-xl bg-slate-950 border border-purple-500/30">
                    <div className="font-bold text-purple-300 mb-1">
                      AI 추정 지구과학 배경 (Inferred Climate)
                    </div>
                    <div className="font-mono-tech text-sm font-bold text-white mb-1">
                      {analysis.inferredClimate}
                    </div>
                    <p className="text-slate-400 leading-relaxed">
                      입력 문장에 명시되지 않은 배경 기후는 GloH2O 쾨펜 기후 구분 데이터와 매칭된 최상위 지구 후보지의 관측 값을 기준으로 보완되었습니다.
                    </p>
                  </div>
                </div>
              </div>
            </section>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
